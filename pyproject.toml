[project]
name = "pmaa-web-backend"
version = "0.1.0"
description = "Production-oriented backend for the PMAA multi-agent web platform"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "arq>=0.26.3",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.60",
    "minio>=7.2.15",
    "pydantic-settings>=2.7.0",
    "pypdf>=5.3.0",
    "python-dotenv>=1.0.1",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.13.2",
    "redis>=5.2.0",
    "fastembed>=0.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
